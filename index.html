<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {

.game-container {

  align-items: center;

}
.game-frame {

  padding: 8px;
  background: linear-gradient(135deg, #b45309 0%, #451a03 35%, #78350f 70%, #d97706 100%);

  box-shadow: 0 0 50px rgba(217, 119, 6, 0.3), 0 25px 60px rgba(0, 0, 0, 0.9);
}
canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  border-radius: 8px;
  background: #0b0f19;
  box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95);
}
.quick-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 960px;
  padding: 6px 14px;
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(217, 119, 6, 0.35);
  border-radius: 8px;
  color: #cbd5e1;
  font-size: 11px;
  letter-spacing: 0.5px;
}
.quick-bar button {
  background: rgba(217, 119, 6, 0.18);
  border: 1px solid #d97706;
  color: #fde68a;
  font-family: inherit;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.quick-bar button:hover {
  background: #d97706;
  color: #1e1b18;
}
.quick-bar .chamber-btn-group {
  display: flex;
  gap: 4px;
}
.quick-bar .chamber-btn-group button.active {
  background: #f59e0b;
  color: #0f172a;
}
</style>
</head>
<body>
<div class="game-container">
  <div class="game-frame">
    <canvas id="game"></canvas>
  </div>
  <div class="quick-bar">
    <div>
      <span style="color:#f59e0b; font-weight:700;">CONTROLS:</span>
      WASD/Arrows: Walk &bull; [SPACE]: Jump Traps &bull; [E]: Switch &bull; [R]: Reset Room &bull; [M]: Mute
    </div>
    <div class="chamber-btn-group" id="chamberBtnGroup">
      <span style="color:#f59e0b; font-weight:700; line-height:22px; margin-right:4px;">WARP:</span>
      <button onclick="warpTo(0)">1</button>
      <button onclick="warpTo(1)">2</button>
      <button onclick="warpTo(2)">3</button>
      <button onclick="warpTo(3)">4</button>
      <button onclick="warpTo(4)">5</button>
      <button onclick="warpTo(5)">6</button>
      <button onclick="warpTo(6)">7</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
//  Echoes of the Lost Temple — Royal Ancient Edition (Fully Improvised)
//  Featuring: High-Contrast Dynamic Mazes, Carved 3D Monolith Blocks,
//  Floor Spike Traps, Wall Dart Traps, Crumbling Abyss Tiles, Flame Statues,
//  Player Health & Ankhs, Jumping, Rich Audio, and Full Room Solvability.
// ============================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const TILE = 48;
const COLS = 20;
const ROWS = 14;
canvas.width = COLS * TILE;  // 960
canvas.height = ROWS * TILE; // 672

// --- Procedural Web Audio Engine ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let muted = false;

function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur, type = 'square', vol = 0.08) {
  if (muted) return;
  try {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

function sfxStep() { playTone(120 + Math.random() * 40, 0.04, 'triangle', 0.02); }
function sfxPush() {
  playTone(85, 0.22, 'sawtooth', 0.09);
  setTimeout(() => playTone(65, 0.18, 'sine', 0.06), 40);
}
function sfxSwitch() {
  playTone(600, 0.08, 'square', 0.09);
  setTimeout(() => playTone(900, 0.12, 'square', 0.09), 60);
}
function sfxDoor() {
  playTone(220, 0.35, 'triangle', 0.1);
  setTimeout(() => playTone(330, 0.25, 'triangle', 0.08), 80);
}
function sfxPlate() {
  playTone(340, 0.15, 'sine', 0.1);
  setTimeout(() => playTone(510, 0.18, 'triangle', 0.09), 40);
}
function sfxJump() {
  playTone(280, 0.09, 'sine', 0.09);
  setTimeout(() => playTone(440, 0.12, 'sine', 0.08), 40);
}
function sfxLand() { playTone(110, 0.08, 'triangle', 0.07); }
function sfxCrystal() {
  [523, 659, 784, 1046].forEach((f, i) => {
    setTimeout(() => playTone(f, 0.15, 'sine', 0.09), i * 65);
  });
}
function sfxTeleport() {
  for (let i = 0; i < 7; i++) {
    setTimeout(() => playTone(300 + i * 110, 0.07, 'sine', 0.06), i * 25);
  }
}
function sfxSpikeWarning() {
  playTone(350, 0.06, 'square', 0.04);
  setTimeout(() => playTone(450, 0.06, 'square', 0.04), 70);
}
function sfxSpikeTrigger() {
  playTone(180, 0.12, 'sawtooth', 0.12);
  setTimeout(() => playTone(95, 0.18, 'triangle', 0.1), 40);
}
function sfxDart() {
  playTone(880, 0.06, 'sawtooth', 0.06);
  setTimeout(() => playTone(440, 0.1, 'sine', 0.05), 30);
}
function sfxCrumble() {
  playTone(90, 0.2, 'sawtooth', 0.08);
  setTimeout(() => playTone(60, 0.25, 'triangle', 0.09), 80);
}
function sfxHurt() {
  playTone(160, 0.22, 'sawtooth', 0.15);
  setTimeout(() => playTone(90, 0.28, 'sine', 0.12), 60);
}
function sfxHeart() {
  playTone(440, 0.1, 'sine', 0.08);
  setTimeout(() => playTone(660, 0.16, 'sine', 0.09), 70);
}
function sfxVictory() {
  const notes = [523, 659, 784, 1047, 880, 1047, 1319, 1568];
  notes.forEach((n, i) => setTimeout(() => playTone(n, 0.25, 'sine', 0.12), i * 120));
}

// --- Crisp Procedural Textures (Ensures 100% Reliable Offline Render) ---
const TILE_CANVAS = {};
function initTextures() {
  // 1. Wall Tile
  const wallC = document.createElement('canvas');
  wallC.width = TILE; wallC.height = TILE;
  const wctx = wallC.getContext('2d');
  wctx.fillStyle = '#1c2434';
  wctx.fillRect(0, 0, TILE, TILE);
  // Brick rows
  wctx.strokeStyle = '#0e1422';
  wctx.lineWidth = 2;
  wctx.strokeRect(1, 1, TILE-2, TILE-2);
  wctx.fillStyle = '#2d3748';
  wctx.fillRect(4, 4, 18, 18);
  wctx.fillRect(26, 4, 18, 18);
  wctx.fillRect(4, 26, 38, 18);
  // Highlights
  wctx.fillStyle = '#4a5568';
  wctx.fillRect(4, 4, 18, 2);
  wctx.fillRect(26, 4, 18, 2);
  wctx.fillRect(4, 26, 38, 2);
  // Inner dark borders
  wctx.strokeStyle = '#1a202c';
  wctx.strokeRect(4, 4, 18, 18);
  wctx.strokeRect(26, 4, 18, 18);
  wctx.strokeRect(4, 26, 38, 18);
  TILE_CANVAS.wall = wallC;

  // 2. Floor Tile
  const floorC = document.createElement('canvas');
  floorC.width = TILE; floorC.height = TILE;
  const fctx = floorC.getContext('2d');
  fctx.fillStyle = '#3a4454';
  fctx.fillRect(0, 0, TILE, TILE);
  // Stone flagstone bevel
  fctx.strokeStyle = '#4e5a6c';
  fctx.lineWidth = 1;
  fctx.strokeRect(2, 2, TILE-4, TILE-4);
  fctx.strokeStyle = '#272f3d';
  fctx.strokeRect(1, 1, TILE-2, TILE-2);
  // Subtle decorative rune dot
  fctx.fillStyle = '#2f3948';
  fctx.fillRect(TILE/2-2, TILE/2-2, 4, 4);
  TILE_CANVAS.floor = floorC;

  // 3. Abyss / Pit Tile
  const pitC = document.createElement('canvas');
  pitC.width = TILE; pitC.height = TILE;
  const pctx = pitC.getContext('2d');
  pctx.fillStyle = '#060911';
  pctx.fillRect(0, 0, TILE, TILE);
  pctx.strokeStyle = '#111827';
  pctx.strokeRect(3, 3, TILE-6, TILE-6);
  TILE_CANVAS.pit = pitC;
}
initTextures();

// --- Tile Constants ---
const T = {
  EMPTY: 0,
  WALL: 1,
  FLOOR: 2,
  DOOR_CLOSED: 3,
  DOOR_OPEN: 4,
  PRESSURE_PLATE: 5,
  SWITCH_OFF: 6,
  SWITCH_ON: 7,
  CRYSTAL: 8,
  PORTAL_A: 9,
  PORTAL_B: 10,
  PIT: 11,
};

// --- Input System ---
const keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) {
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('click', () => ensureAudio());

// --- Player State ---
const player = {
  x: 0, y: 0, vx: 0, vy: 0,
  z: 0, vz: 0, isJumping: false, jumpCooldown: 0,
  w: TILE * 0.72, h: TILE * 0.72,
  speed: 4.8, accel: 0.5, decel: 0.55,
  facingX: 0, facingY: 1,
  flipX: false,
  hp: 3, maxHp: 3,
  invulnTimer: 0,
  interactCooldown: 0,
  teleportCooldown: 0,
  screenShake: 0,
};

// --- Game Globals ---
let gameState = 'menu'; // menu, playing, paused, victory, gameover
let crystalCount = 0;
let totalCrystals = 0;
let currentRoomIndex = 0;
let notification = null;
let notificationTimer = 0;
let roomTransition = 0;
let roomTransDir = 0;
let nextRoomIndex = -1;
let stepTimer = 0;
let particles = [];
let victoryTimer = 0;
let switchHintCooldown = 0;
let bumpWarningCooldown = 0;

// Ambient torch embers
const ambientEmbers = [];
for (let i = 0; i < 40; i++) {
  ambientEmbers.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 16,
    vy: -Math.random() * 20 - 8,
    size: Math.random() * 2.2 + 1,
    alpha: Math.random() * 0.6 + 0.2,
    color: Math.random() > 0.35 ? '#F59E0B' : '#EF4444'
  });
}

// --- Notification Banner ---
function showNotification(text, dur = 2.4) {
  notification = text;
  notificationTimer = dur;
}

// --- Room Builders with REAL Mazes & Engaging Traps ---
function makeEmptyMap() {
  const m = [];
  for (let y = 0; y < ROWS; y++) {
    m[y] = [];
    for (let x = 0; x < COLS; x++) {
      if (y === 0 || y === ROWS-1 || x === 0 || x === COLS-1) m[y][x] = T.WALL;
      else m[y][x] = T.FLOOR;
    }
  }
  return m;
}

function createRooms() {
  const rms = [];

  // ==========================================================================
  // CHAMBER 1: The Forgotten Entrance (Introduction & First Trials)
  // Maze corridors, pushable monoliths, floor spike traps with jump timing!
  // ==========================================================================
  const m1 = makeEmptyMap();
  for (let y = 1; y <= 5; y++) m1[y][6] = T.WALL;
  for (let y = 8; y <= 12; y++) m1[y][6] = T.WALL;
  for (let x = 6; x <= 13; x++) m1[5][x] = T.WALL;
  m1[5][10] = T.FLOOR; // opening
  for (let x = 6; x <= 13; x++) m1[9][x] = T.WALL;
  m1[9][9] = T.FLOOR; // opening
  for (let y = 2; y <= 11; y++) m1[y][14] = T.WALL;
  m1[7][14] = T.FLOOR; // pathway to exit gate

  rms.push({
    name: 'The Forgotten Entrance',
    crystalsNeeded: 0,
    map: m1,
    spawnX: 2, spawnY: 7,
    exit: {x: 19, y: 7},
    blocks: [
      {x: 4, y: 3}, // Monolith 1
      {x: 4, y: 11} // Monolith 2
    ],
    doors: [
      {x: 17, y: 7, type: 'plate', plateX: 11, plateY: 7}
    ],
    switches: [],
    portals: [],
    crystals: [
      {x: 2, y: 2},
      {x: 10, y: 2},
      {x: 10, y: 11}
    ],
    hearts: [
      {x: 2, y: 11}
    ],
    spikes: [
      {x: 8, y: 7, timer: 0, interval: 2.2, duration: 1.0, active: false},
      {x: 10, y: 7, timer: 1.1, interval: 2.2, duration: 1.0, active: false},
      {x: 15, y: 7, timer: 0.5, interval: 2.0, duration: 0.9, active: false}
    ],
    dartTraps: [],
    crumbleTiles: [],
    flames: []
  });

  // ==========================================================================
  // CHAMBER 2: Hall of Whispering Darts (Block Shield Mechanics)
  // Wall-mounted dart dispensers fire across corridors. Push monoliths to shield!
  // ==========================================================================
  const m2 = makeEmptyMap();
  for (let y = 1; y <= 5; y++) m2[y][5] = T.WALL;
  for (let y = 8; y <= 12; y++) m2[y][5] = T.WALL;
  for (let y = 3; y <= 10; y++) m2[y][10] = T.WALL;
  m2[6][10] = T.FLOOR;
  for (let y = 1; y <= 5; y++) m2[y][15] = T.WALL;
  for (let y = 9; y <= 12; y++) m2[y][15] = T.WALL;

  rms.push({
    name: 'Hall of Whispering Darts',
    crystalsNeeded: 1,
    map: m2,
    spawnX: 2, spawnY: 7,
    exit: {x: 19, y: 7},
    blocks: [
      {x: 4, y: 7},  // Shield monolith
      {x: 8, y: 3},  // Weight monolith
      {x: 12, y: 10} // Weight monolith 2
    ],
    doors: [
      {x: 10, y: 6, type: 'plate', plateX: 8, plateY: 6},
      {x: 18, y: 7, type: 'plate', plateX: 13, plateY: 7}
    ],
    switches: [],
    portals: [],
    crystals: [
      {x: 8, y: 2},
      {x: 13, y: 2},
      {x: 17, y: 11}
    ],
    hearts: [
      {x: 3, y: 11}
    ],
    spikes: [
      {x: 12, y: 6, timer: 0, interval: 2.5, duration: 1.0, active: false}
    ],
    dartTraps: [
      {x: 7, y: 1, dirX: 0, dirY: 1, timer: 0, interval: 1.8},
      {x: 13, y: 12, dirX: 0, dirY: -1, timer: 0.9, interval: 1.8}
    ],
    crumbleTiles: [],
    flames: []
  });

  // ==========================================================================
  // CHAMBER 3: The Labyrinth of Spikes (Full Winding Maze)
  // Deep winding stone maze, timed floor spikes, and dual switches.
  // ==========================================================================
  const m3 = makeEmptyMap();
  for (let x = 3; x <= 8; x++) m3[3][x] = T.WALL;
  for (let y = 3; y <= 8; y++) m3[y][3] = T.WALL;
  m3[6][3] = T.FLOOR;
  for (let x = 3; x <= 8; x++) m3[8][x] = T.WALL;
  m3[8][6] = T.FLOOR;
  for (let y = 3; y <= 10; y++) m3[y][8] = T.WALL;
  m3[5][8] = T.FLOOR;
  for (let x = 11; x <= 16; x++) m3[5][x] = T.WALL;
  m3[5][13] = T.FLOOR;
  for (let x = 11; x <= 16; x++) m3[9][x] = T.WALL;
  m3[9][14] = T.FLOOR;
  for (let y = 2; y <= 9; y++) m3[y][11] = T.WALL;
  m3[7][11] = T.FLOOR;
  for (let y = 5; y <= 11; y++) m3[y][16] = T.WALL;
  m3[8][16] = T.FLOOR;

  rms.push({
    name: 'The Labyrinth of Spikes',
    crystalsNeeded: 2,
    map: m3,
    spawnX: 1, spawnY: 6,
    exit: {x: 19, y: 7},
    blocks: [
      {x: 5, y: 6},
      {x: 13, y: 7}
    ],
    doors: [
      {x: 8, y: 5, type: 'switch'},
      {x: 18, y: 7, type: 'switch'}
    ],
    switches: [
      {x: 5, y: 2, doorIdx: 0},
      {x: 14, y: 11, doorIdx: 1}
    ],
    portals: [],
    crystals: [
      {x: 1, y: 11},
      {x: 6, y: 5},
      {x: 14, y: 2}
    ],
    hearts: [
      {x: 17, y: 2}
    ],
    spikes: [
      {x: 6, y: 6, timer: 0.2, interval: 2.0, duration: 0.9, active: false},
      {x: 9, y: 5, timer: 1.0, interval: 2.0, duration: 0.9, active: false},
      {x: 12, y: 7, timer: 0.6, interval: 2.2, duration: 1.0, active: false},
      {x: 15, y: 7, timer: 1.5, interval: 2.2, duration: 1.0, active: false}
    ],
    dartTraps: [
      {x: 1, y: 9, dirX: 1, dirY: 0, timer: 0.5, interval: 2.4}
    ],
    crumbleTiles: [],
    flames: []
  });

  // ==========================================================================
  // CHAMBER 4: The Void Chasm & Crumbling Slabs (Floor Fall Hazard)
  // Stepping on cracked tiles makes them shake and crumble into the abyss!
  // ==========================================================================
  const m4 = makeEmptyMap();
  for (let y = 1; y <= 12; y++) {
    m4[y][9] = T.PIT;
    m4[y][10] = T.PIT;
  }
  m4[4][9] = T.FLOOR; m4[4][10] = T.FLOOR;
  m4[9][9] = T.FLOOR; m4[9][10] = T.FLOOR;

  for (let y = 1; y <= 6; y++) m4[y][4] = T.WALL;
  for (let y = 8; y <= 12; y++) m4[y][4] = T.WALL;
  for (let y = 2; y <= 6; y++) m4[y][15] = T.WALL;
  for (let y = 8; y <= 12; y++) m4[y][15] = T.WALL;

  rms.push({
    name: 'The Void Chasm & Crumbling Slabs',
    crystalsNeeded: 4,
    map: m4,
    spawnX: 2, spawnY: 7,
    exit: {x: 19, y: 7},
    blocks: [
      {x: 6, y: 4},
      {x: 6, y: 9}
    ],
    doors: [
      {x: 14, y: 7, type: 'plate', plateX: 12, plateY: 7},
      {x: 18, y: 7, type: 'switch'}
    ],
    switches: [
      {x: 17, y: 3, doorIdx: 1}
    ],
    portals: [],
    crystals: [
      {x: 2, y: 2},
      {x: 12, y: 2},
      {x: 17, y: 11}
    ],
    hearts: [
      {x: 2, y: 11}
    ],
    spikes: [
      {x: 13, y: 7, timer: 0.8, interval: 2.0, duration: 0.9, active: false}
    ],
    dartTraps: [
      {x: 9, y: 1, dirX: 0, dirY: 1, timer: 0.2, interval: 2.1}
    ],
    crumbleTiles: [
      {x: 4, y: 9, timer: 0, state: 'idle'},
      {x: 9, y: 9, timer: 0, state: 'idle'},
      {x: 10, y: 4, timer: 0, state: 'idle'},
      {x: 7, y: 7, timer: 0, state: 'idle'}
    ],
    flames: []
  });

  // ==========================================================================
  // CHAMBER 5: Astral Sanctuary of Portals
  // Color-coded portals connecting isolated quadrants with crossfire traps.
  // ==========================================================================
  const m5 = makeEmptyMap();
  for (let y = 1; y <= 12; y++) m5[y][10] = T.WALL;
  for (let x = 1; x <= 18; x++) m5[7][x] = T.WALL;
  m5[7][5] = T.FLOOR;
  m5[7][15] = T.FLOOR;

  rms.push({
    name: 'Astral Sanctuary of Portals',
    crystalsNeeded: 6,
    map: m5,
    spawnX: 2, spawnY: 4,
    exit: {x: 19, y: 4},
    blocks: [
      {x: 4, y: 3},
      {x: 14, y: 10}
    ],
    doors: [
      {x: 5, y: 7, type: 'switch'},
      {x: 15, y: 7, type: 'plate', plateX: 13, plateY: 10},
      {x: 18, y: 4, type: 'switch'}
    ],
    switches: [
      {x: 3, y: 10, doorIdx: 0},
      {x: 17, y: 10, doorIdx: 2}
    ],
    portals: [
      {ax: 7, ay: 3, bx: 14, by: 11, color: '#06B6D4'},
      {ax: 7, ay: 10, bx: 14, by: 3, color: '#A855F7'}
    ],
    crystals: [
      {x: 2, y: 11},
      {x: 17, y: 2},
      {x: 12, y: 4}
    ],
    hearts: [
      {x: 17, y: 11}
    ],
    spikes: [
      {x: 5, y: 3, timer: 0.4, interval: 1.8, duration: 0.9, active: false},
      {x: 16, y: 4, timer: 1.0, interval: 2.0, duration: 0.9, active: false}
    ],
    dartTraps: [
      {x: 10, y: 2, dirX: -1, dirY: 0, timer: 0.6, interval: 1.9},
      {x: 10, y: 11, dirX: 1, dirY: 0, timer: 1.2, interval: 1.9}
    ],
    crumbleTiles: [
      {x: 6, y: 3, timer: 0, state: 'idle'},
      {x: 15, y: 11, timer: 0, state: 'idle'}
    ],
    flames: []
  });

  // ==========================================================================

  // ==========================================================================

  const m7 = makeEmptyMap();
  for (let y = 2; y <= 11; y++) {

// --- Active Room Runtime State ---
let rooms = [];
let room = null;
let roomBlocks = [];
let roomDoors = [];
let roomSwitches = [];
let roomPortals = [];
let roomCrystals = [];
let roomHearts = [];
let roomSpikes = [];
let roomDartTraps = [];
let roomCrumbleTiles = [];
let roomFlames = [];
let projectiles = [];
let collectedCrystals = new Set();
let collectedHearts = new Set();

function loadRoom(idx) {
  currentRoomIndex = idx;
  room = rooms[idx];

  if (room.exit) room.map[room.exit.y][room.exit.x] = T.FLOOR;
  room.map[room.spawnY][room.spawnX] = T.FLOOR;

  if (room.exit) {
    const ex = room.exit.x, ey = room.exit.y;
    if (ex === COLS - 1 && room.map[ey][ex - 1] === T.WALL) room.map[ey][ex - 1] = T.FLOOR;
    if (ex === 0 && room.map[ey][ex + 1] === T.WALL) room.map[ey][ex + 1] = T.FLOOR;
  }

  roomBlocks = room.blocks.map(b => ({x: b.x, y: b.y, displayX: b.x * TILE, displayY: b.y * TILE}));
  roomDoors = room.doors.map((d, i) => ({...d, open: false, idx: i}));
  roomSwitches = (room.switches || []).map(s => ({...s, on: false}));
  roomPortals = (room.portals || []).map(p => ({...p}));
  roomCrystals = (room.crystals || []).map((c, i) => {
    const key = `${idx}_${i}`;
    return {...c, collected: collectedCrystals.has(key), idx: i};
  });
  roomHearts = (room.hearts || []).map((h, i) => {
    const key = `h_${idx}_${i}`;
    return {...h, collected: collectedHearts.has(key), idx: i};
  });
  roomSpikes = (room.spikes || []).map(s => ({...s, timer: s.timer || 0, active: false}));
  roomDartTraps = (room.dartTraps || []).map(dt => ({...dt, timer: dt.timer || 0}));
  roomCrumbleTiles = (room.crumbleTiles || []).map(ct => ({...ct, timer: 0, state: 'idle'}));
  roomFlames = (room.flames || []).map(fl => ({...fl, timer: fl.timer || 0, active: false}));
  projectiles = [];

  player.x = room.spawnX * TILE + TILE / 2;
  player.y = room.spawnY * TILE + TILE / 2;
  player.vx = 0; player.vy = 0;
  player.z = 0; player.vz = 0;
  player.isJumping = false;
  player.teleportCooldown = 0;
  player.invulnTimer = 0;
  particles = [];

  const btns = document.querySelectorAll('#chamberBtnGroup button');
  btns.forEach((b, i) => {
    if (i === idx) b.classList.add('active');
    else b.classList.remove('active');
  });
}

function warpTo(idx) {
  if (idx < 0 || idx >= rooms.length) return;
  loadRoom(idx);
  gameState = 'playing';
  showNotification(`Chamber ${idx + 1}: ${rooms[idx].name}`);
}

function transitionToRoom(idx) {
  if (idx >= rooms.length) {
    gameState = 'victory';
    sfxVictory();
    victoryTimer = 0;
    return;
  }
  if (rooms[idx].crystalsNeeded > crystalCount) {
    showNotification(`🔒 Need ${rooms[idx].crystalsNeeded} Crystals to Enter! (You have ${crystalCount})`, 2.5);
    return;
  }
  nextRoomIndex = idx;
  roomTransition = 1;
  roomTransDir = 1;
}

// --- Collision Checks ---
function isSolid(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return true;
  const tile = room.map[ty][tx];
  if (tile === T.WALL) return true;
  if (tile === T.PIT) {
    return !player.isJumping;
  }
  for (const d of roomDoors) {
    if (d.x === tx && d.y === ty && !d.open) return true;
  }
  return false;
}

function isBlockAt(tx, ty) {
  return roomBlocks.find(b => b.x === tx && b.y === ty);
}

// --- Player Movement & Block Pushing ---
function updatePlayer(dt) {
  if (player.screenShake > 0) player.screenShake = Math.max(0, player.screenShake - dt * 25);
  if (player.invulnTimer > 0) player.invulnTimer -= dt;

  let ix = 0, iy = 0;
  if (keys['w'] || keys['arrowup']) iy -= 1;
  if (keys['s'] || keys['arrowdown']) iy += 1;
  if (keys['a'] || keys['arrowleft']) ix -= 1;
  if (keys['d'] || keys['arrowright']) ix += 1;

  const len = Math.sqrt(ix * ix + iy * iy);
  if (len > 0) {
    ix /= len;
    iy /= len;
    player.facingX = ix;
    player.facingY = iy;
    if (Math.abs(ix) > 0.1) player.flipX = ix < 0;
  }

  const maxSpd = player.speed * TILE;
  if (len > 0) {
    player.vx += (ix * maxSpd - player.vx) * player.accel;
    player.vy += (iy * maxSpd - player.vy) * player.accel;
  } else {
    player.vx *= (1 - player.decel);
    player.vy *= (1 - player.decel);
    if (Math.abs(player.vx) < 1) player.vx = 0;
    if (Math.abs(player.vy) < 1) player.vy = 0;
  }

  if (Math.abs(player.vx) > 12 || Math.abs(player.vy) > 12) {
    stepTimer -= dt;
    if (stepTimer <= 0) {
      if (!player.isJumping) sfxStep();
      stepTimer = 0.24;
    }
  }

  let newX = player.x + player.vx * dt;
  if (!collidesAt(newX, player.y)) {
    player.x = newX;
  } else {
    tryPushBlock(newX, player.y, Math.sign(player.vx), 0);
    player.vx = 0;
  }

  let newY = player.y + player.vy * dt;
  if (!collidesAt(player.x, newY)) {
    player.y = newY;
  } else {
    tryPushBlock(player.x, newY, 0, Math.sign(player.vy));
    player.vy = 0;
  }

  if (keys[' '] && !player.isJumping && player.jumpCooldown <= 0) {
    player.isJumping = true;
    player.vz = 230;
    player.jumpCooldown = 0.3;
    sfxJump();
    spawnParticles(player.x, player.y + player.h/2, '#94A3B8', 5);
  }

  if (player.jumpCooldown > 0) player.jumpCooldown -= dt;
  if (player.isJumping) {
    player.vz -= 720 * dt;
    player.z += player.vz * dt;
    if (player.z <= 0) {
      player.z = 0;
      player.vz = 0;
      player.isJumping = false;
      sfxLand();
      spawnParticles(player.x, player.y + player.h/2, '#64748B', 6);
    }
  }

  for (const b of roomBlocks) {
    const targetX = b.x * TILE;
    const targetY = b.y * TILE;
    b.displayX += (targetX - b.displayX) * 0.35;
    b.displayY += (targetY - b.displayY) * 0.35;
  }

  if (player.interactCooldown > 0) player.interactCooldown -= dt;
  if (keys['e'] && player.interactCooldown <= 0) {
    interact();
    player.interactCooldown = 0.3;
  }

  if (keys['r']) {
    loadRoom(currentRoomIndex);
    showNotification('Chamber Reset');
    keys['r'] = false;
  }

  for (const sw of roomSwitches) {
    const dist = Math.hypot((sw.x + 0.5) * TILE - player.x, (sw.y + 0.5) * TILE - player.y);
    if (dist < TILE * 1.5 && switchHintCooldown <= 0) {
      showNotification(sw.on ? '⚡ Lever Activated! Press [E] to toggle' : '⚡ Ancient Lever: Press [E] to pull', 1.8);
      switchHintCooldown = 3.5;
    }
  }
  if (switchHintCooldown > 0) switchHintCooldown -= dt;
}

function collidesAt(px, py) {
  const hw = player.w / 2, hh = player.h / 2;
  const left = Math.floor((px - hw) / TILE);
  const right = Math.floor((px + hw - 1) / TILE);
  const top = Math.floor((py - hh) / TILE);
  const bot = Math.floor((py + hh - 1) / TILE);

  for (let ty = top; ty <= bot; ty++) {
    for (let tx = left; tx <= right; tx++) {
      if (isSolid(tx, ty)) return true;
      if (isBlockAt(tx, ty)) return true;
    }
  }
  return false;
}

function tryPushBlock(px, py, dx, dy) {
  if (dx === 0 && dy === 0) return;
  const hw = player.w / 2, hh = player.h / 2;
  const checkX = dx !== 0 ? Math.floor((px + (dx > 0 ? hw : -hw)) / TILE) : Math.floor(player.x / TILE);
  const checkY = dy !== 0 ? Math.floor((py + (dy > 0 ? hh : -hh)) / TILE) : Math.floor(player.y / TILE);

  let b = isBlockAt(checkX, checkY);
  if (!b && dx !== 0) {
    b = isBlockAt(checkX, Math.floor((player.y + player.h * 0.3) / TILE)) ||
        isBlockAt(checkX, Math.floor((player.y - player.h * 0.3) / TILE));
  }
  if (!b && dy !== 0) {
    b = isBlockAt(Math.floor((player.x + player.w * 0.3) / TILE), checkY) ||
        isBlockAt(Math.floor((player.x - player.w * 0.3) / TILE), checkY);
  }

  if (b) {
    const destX = b.x + dx;
    const destY = b.y + dy;
    if (room.map[destY] && room.map[destY][destX] === T.FLOOR && !isBlockAt(destX, destY)) {
      const doorHere = roomDoors.find(d => d.x === destX && d.y === destY && !d.open);
      if (!doorHere) {
        b.x = destX;
        b.y = destY;
        sfxPush();
        spawnParticles(destX * TILE + TILE/2, destY * TILE + TILE/2, '#D97706', 7);
      }
    }
  }
}

function interact() {
  const ptx = Math.floor(player.x / TILE);
  const pty = Math.floor(player.y / TILE);

  for (const sw of roomSwitches) {
    if (Math.abs(sw.x - ptx) <= 1 && Math.abs(sw.y - pty) <= 1) {
      sw.on = !sw.on;
      sfxSwitch();
      spawnParticles((sw.x + 0.5) * TILE, (sw.y + 0.5) * TILE, '#F59E0B', 8);
      showNotification(sw.on ? 'Ancient Gate Lever ACTIVATED' : 'Lever DEACTIVATED');
    }
  }
}

// --- Damage & Respawn System ---
function damagePlayer(sourceName = 'Trap') {
  if (player.invulnTimer > 0) return;
  player.hp -= 1;
  player.invulnTimer = 1.6;
  player.screenShake = 12;
  sfxHurt();
  spawnParticles(player.x, player.y, '#EF4444', 16);
  showNotification(`💥 Wounded by ${sourceName}! (${player.hp} Ankhs left)`, 1.8);

  if (player.hp <= 0) {
    showNotification('💀 The temple spirits claim you! Respawning at chamber entrance...', 2.5);
    player.hp = player.maxHp;
    player.x = room.spawnX * TILE + TILE / 2;
    player.y = room.spawnY * TILE + TILE / 2;
    player.vx = 0; player.vy = 0;
    player.z = 0;
  }
}

// --- Traps & Mechanics Update ---
function updateTraps(dt) {
  const ptx = Math.floor(player.x / TILE);
  const pty = Math.floor(player.y / TILE);

  for (const sp of roomSpikes) {
    sp.timer += dt;
    const cycle = sp.timer % sp.interval;
    const warningTime = sp.interval - 0.45;

    if (cycle >= warningTime && cycle < warningTime + 0.1) {
      if (Math.hypot((sp.x + 0.5)*TILE - player.x, (sp.y + 0.5)*TILE - player.y) < TILE * 3) {
        sfxSpikeWarning();
      }
    }

    if (cycle < sp.duration) {
      if (!sp.active) {
        sp.active = true;
        sfxSpikeTrigger();
        spawnParticles((sp.x + 0.5)*TILE, (sp.y + 0.5)*TILE, '#CBD5E1', 4);
      }
      if (ptx === sp.x && pty === sp.y && !player.isJumping) {
        damagePlayer('Floor Spikes');
      }
    } else {
      sp.active = false;
    }
  }

  for (const dtTrap of roomDartTraps) {
    dtTrap.timer += dt;
    if (dtTrap.timer >= dtTrap.interval) {
      dtTrap.timer = 0;
      sfxDart();
      projectiles.push({
        x: (dtTrap.x + 0.5) * TILE,
        y: (dtTrap.y + 0.5) * TILE,
        vx: dtTrap.dirX * 260,
        vy: dtTrap.dirY * 260,
        life: 3.0
      });
    }
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;

    const tx = Math.floor(p.x / TILE);
    const ty = Math.floor(p.y / TILE);

    if (room.map[ty] && room.map[ty][tx] === T.WALL) {
      spawnParticles(p.x, p.y, '#F59E0B', 4);
      projectiles.splice(i, 1);
      continue;
    }

    if (isBlockAt(tx, ty)) {
      spawnParticles(p.x, p.y, '#94A3B8', 6);
      projectiles.splice(i, 1);
      continue;
    }

    const distToPlayer = Math.hypot(p.x - player.x, p.y - player.y);
    if (distToPlayer < player.w * 0.45 && !player.isJumping) {
      damagePlayer('Poison Dart');
      projectiles.splice(i, 1);
      continue;
    }

    if (p.life <= 0) projectiles.splice(i, 1);
  }

  for (const ct of roomCrumbleTiles) {
    if (ct.state === 'idle') {
      if (ptx === ct.x && pty === ct.y && !player.isJumping) {
        ct.state = 'shaking';
        ct.timer = 0.55;
        sfxCrumble();
      }
    } else if (ct.state === 'shaking') {
      ct.timer -= dt;
      if (ct.timer <= 0) {
        ct.state = 'fallen';
        room.map[ct.y][ct.x] = T.PIT;
        spawnParticles((ct.x + 0.5)*TILE, (ct.y + 0.5)*TILE, '#475569', 12);
        if (ptx === ct.x && pty === ct.y && !player.isJumping) {
          damagePlayer('Abyssal Chasm');
        }
      }
    }
  }

  for (const fl of roomFlames) {
    fl.timer += dt;
    const cycle = fl.timer % fl.interval;
    if (cycle < fl.duration) {
      fl.active = true;
      if (Math.random() < 0.25) {
        spawnParticles((fl.x + 0.5)*TILE, (fl.y + 0.5)*TILE, '#EF4444', 2);
      }
      if (ptx === fl.x && pty === fl.y && !player.isJumping) {
        damagePlayer('Sacred Fire');
      }
    } else {
      fl.active = false;
    }
  }
}

// --- Doors, Crystals, Hearts, Portals & Exit Updates ---
function updateDoors() {
  for (const d of roomDoors) {
    let shouldOpen = false;
    if (d.type === 'plate') {
      const blockOn = roomBlocks.some(b => b.x === d.plateX && b.y === d.plateY);
      const playerOn = Math.floor(player.x / TILE) === d.plateX && Math.floor(player.y / TILE) === d.plateY;
      shouldOpen = blockOn || playerOn;
    } else if (d.type === 'switch') {
      const sw = roomSwitches.find(s => s.doorIdx === d.idx);
      if (sw) shouldOpen = sw.on;
    }

    if (shouldOpen && !d.open) {
      d.open = true;
      sfxDoor();
      spawnParticles((d.x + 0.5)*TILE, (d.y + 0.5)*TILE, '#06B6D4', 10);
      showNotification('Ancient Portcullis Raised!');
    } else if (!shouldOpen && d.open) {
      const ptx = Math.floor(player.x / TILE);
      const pty = Math.floor(player.y / TILE);
      if (ptx !== d.x || pty !== d.y) {
        d.open = false;
      }
    }
  }
}

function updateCollectibles() {
  const ptx = Math.floor(player.x / TILE);
  const pty = Math.floor(player.y / TILE);

  for (const c of roomCrystals) {
    if (!c.collected && c.x === ptx && c.y === pty) {
      c.collected = true;
      collectedCrystals.add(`${currentRoomIndex}_${c.idx}`);
      crystalCount++;
      sfxCrystal();
      spawnParticles((c.x + 0.5)*TILE, (c.y + 0.5)*TILE, '#C084FC', 14);
      showNotification(`💎 Sacred Crystal Discovered! (${crystalCount}/${totalCrystals})`);
    }
  }

  for (const h of roomHearts) {
    if (!h.collected && h.x === ptx && h.y === pty) {
      h.collected = true;
      collectedHearts.add(`h_${currentRoomIndex}_${h.idx}`);
      player.hp = Math.min(player.maxHp, player.hp + 1);
      sfxHeart();
      spawnParticles((h.x + 0.5)*TILE, (h.y + 0.5)*TILE, '#EC4899', 12);
      showNotification('❤️ Ankh of Restoration! Health fully restored!');
    }
  }
}

function updatePortals() {
  if (player.teleportCooldown > 0) return;
  const ptx = Math.floor(player.x / TILE);
  const pty = Math.floor(player.y / TILE);

  for (const p of roomPortals) {
    if (ptx === p.ax && pty === p.ay) {
      player.x = (p.bx + 0.5) * TILE;
      player.y = (p.by + 0.5) * TILE;
      player.teleportCooldown = 0.6;
      sfxTeleport();
      spawnParticles(player.x, player.y, p.color || '#06B6D4', 16);
      showNotification('🌀 Dimensional Rift Traversed!');
      return;
    }
    if (ptx === p.bx && pty === p.by) {
      player.x = (p.ax + 0.5) * TILE;
      player.y = (p.ay + 0.5) * TILE;
      player.teleportCooldown = 0.6;
      sfxTeleport();
      spawnParticles(player.x, player.y, p.color || '#06B6D4', 16);
      showNotification('🌀 Dimensional Rift Traversed!');
      return;
    }
  }
}

function updateExit() {
  const ptx = Math.floor(player.x / TILE);
  const pty = Math.floor(player.y / TILE);

  if (room.exit && ptx === room.exit.x && pty === room.exit.y) {
    const allDoorsOpen = roomDoors.every(d => d.open);
    if (allDoorsOpen || roomDoors.length === 0) {
      transitionToRoom(currentRoomIndex + 1);
    } else {
      showNotification('🔒 Gates Sealed: Solve the chamber puzzle!');
    }
  }
}

// --- Particles & Transition ---
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 120,
      vy: (Math.random() - 0.5) * 120,
      life: 0.4 + Math.random() * 0.4,
      maxLife: 0.4 + Math.random() * 0.4,
      color,
      size: 2 + Math.random() * 3.5
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (const m of ambientEmbers) {
    m.y += m.vy * dt;
    m.x += m.vx * dt;
    if (m.y < -10) m.y = canvas.height + 10;
    if (m.x < -10) m.x = canvas.width + 10;
    if (m.x > canvas.width + 10) m.x = -10;
  }
}

function updateTransition(dt) {
  if (roomTransDir === 1) {
    roomTransition += dt * 3.5;
    if (roomTransition >= 1) {
      roomTransition = 1;
      roomTransDir = -1;
      if (nextRoomIndex >= 0 && nextRoomIndex < rooms.length) {
        loadRoom(nextRoomIndex);
      }
    }
  } else if (roomTransDir === -1) {
    roomTransition -= dt * 3.5;
    if (roomTransition <= 0) {
      roomTransition = 0;
      roomTransDir = 0;
    }
  }
}

// ============================================================================
//  DRAWING PIPELINE: High-Contrast, Crystal-Clear Walls, Monoliths & Traps
// ============================================================================
function drawRoom() {
  ctx.save();
  if (player.screenShake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * player.screenShake,
      (Math.random() - 0.5) * player.screenShake
    );
  }

  // 1. Draw Map Tiles (Walls, Floors, Chasms)
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const tile = room.map[y][x];
      const px = x * TILE, py = y * TILE;

      if (tile === T.WALL) {
        ctx.drawImage(TILE_CANVAS.wall, px, py);
      } else if (tile === T.PIT) {
        ctx.drawImage(TILE_CANVAS.pit, px, py);
      } else {
        ctx.drawImage(TILE_CANVAS.floor, px, py);
      }
    }
  }

  // 2. Crumble Tiles
  for (const ct of roomCrumbleTiles) {
    if (ct.state === 'shaking') {
      const shakeX = (Math.random() - 0.5) * 4;
      const shakeY = (Math.random() - 0.5) * 4;
      ctx.drawImage(TILE_CANVAS.floor, ct.x * TILE + shakeX, ct.y * TILE + shakeY);
      ctx.strokeStyle = '#0F172A';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ct.x * TILE + 8, ct.y * TILE + 8);
      ctx.lineTo(ct.x * TILE + TILE - 8, ct.y * TILE + TILE - 8);
      ctx.moveTo(ct.x * TILE + TILE - 10, ct.y * TILE + 10);
      ctx.lineTo(ct.x * TILE + 10, ct.y * TILE + TILE - 10);
      ctx.stroke();
    }
  }

  // 3. Pressure Plates (Engraved Bronze Sockets)
  for (const d of roomDoors) {
    if (d.type === 'plate') {
      const isPressed = roomBlocks.some(b => b.x === d.plateX && b.y === d.plateY) ||
                       (Math.floor(player.x/TILE) === d.plateX && Math.floor(player.y/TILE) === d.plateY);
      const px = d.plateX * TILE, py = d.plateY * TILE;

      if (!isPressed && !d.open) {
        ctx.save();
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 6]);
        ctx.beginPath();
        ctx.moveTo(px + TILE/2, py + TILE/2);
        ctx.lineTo(d.x * TILE + TILE/2, d.y * TILE + TILE/2);
        ctx.stroke();
        ctx.restore();
      }

      ctx.fillStyle = isPressed ? '#064E3B' : '#1C1917';
      ctx.fillRect(px + 5, py + 5, TILE - 10, TILE - 10);

      ctx.fillStyle = isPressed ? '#10B981' : '#D97706';
      ctx.beginPath();
      ctx.arc(px + TILE/2, py + TILE/2, TILE * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = isPressed ? '#34D399' : '#FBBF24';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = isPressed ? '#ECFDF5' : '#78350F';
      ctx.fillRect(px + TILE/2 - 3, py + TILE/2 - 3, 6, 6);
    }
  }

  // 4. Floor Spike Traps (Visible Holes & Lethal Golden Spikes)
  for (const sp of roomSpikes) {
    const sx = sp.x * TILE, sy = sp.y * TILE;
    ctx.fillStyle = '#0F172A';
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 3; col++) {
        ctx.fillRect(sx + 10 + col * 12, sy + 10 + row * 12, 6, 6);
      }
    }

    if (sp.active) {
      ctx.fillStyle = '#CBD5E1';
      ctx.strokeStyle = '#F59E0B';
      ctx.lineWidth = 1.5;
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const tipX = sx + 13 + col * 12;
          const tipY = sy + 7 + row * 12;
          ctx.beginPath();
          ctx.moveTo(tipX, tipY);
          ctx.lineTo(tipX - 4, tipY + 9);
          ctx.lineTo(tipX + 4, tipY + 9);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
      }
    }
  }

  // 5. Flame Statues
  for (const fl of roomFlames) {
    const fx = fl.x * TILE, fy = fl.y * TILE;
    ctx.fillStyle = '#78350F';
    ctx.fillRect(fx + 10, fy + 10, TILE - 20, TILE - 20);
    ctx.strokeStyle = '#F59E0B';
    ctx.lineWidth = 2;
    ctx.strokeRect(fx + 10, fy + 10, TILE - 20, TILE - 20);

    if (fl.active) {
      const grad = ctx.createRadialGradient(fx + TILE/2, fy + TILE/2, 2, fx + TILE/2, fy + TILE/2, TILE * 0.6);
      grad.addColorStop(0, '#FFFBEB');
      grad.addColorStop(0.3, '#F59E0B');
      grad.addColorStop(0.8, '#DC2626');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(fx + TILE/2, fy + TILE/2, TILE * 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 6. Wall Dart Shooters
  for (const dtTrap of roomDartTraps) {
    const dx = dtTrap.x * TILE, dy = dtTrap.y * TILE;
    ctx.fillStyle = '#334155';
    ctx.fillRect(dx + 12, dy + 12, TILE - 24, TILE - 24);
    ctx.fillStyle = '#EF4444';
    ctx.beginPath();
    ctx.arc(dx + TILE/2, dy + TILE/2, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const p of projectiles) {
    ctx.save();
    ctx.fillStyle = '#F59E0B';
    ctx.shadowColor = '#EF4444';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 7. Ancient Levers / Switches
  for (const sw of roomSwitches) {
    const sx = (sw.x + 0.5) * TILE, sy = (sw.y + 0.5) * TILE;
    ctx.fillStyle = sw.on ? '#10B981' : '#475569';
    ctx.beginPath();
    ctx.arc(sx, sy, TILE * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = sw.on ? '#34D399' : '#94A3B8';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.strokeStyle = '#FDE68A';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + (sw.on ? 10 : -10), sy - 14);
    ctx.stroke();
  }

  // 8. Portals
  const portalPulse = Math.sin(Date.now() * 0.006) * 0.25 + 0.75;
  for (const p of roomPortals) {
    drawPortal(p.ax, p.ay, portalPulse, p.color || '#06B6D4');
    drawPortal(p.bx, p.by, portalPulse, p.color || '#06B6D4');
  }

  // 9. Collectibles: Crystals & Hearts
  const bob = Math.sin(Date.now() * 0.005) * 4;
  for (const c of roomCrystals) {
    if (!c.collected) {
      drawCrystal((c.x + 0.5) * TILE, (c.y + 0.5) * TILE + bob);
    }
  }
  for (const h of roomHearts) {
    if (!h.collected) {
      drawHeart((h.x + 0.5) * TILE, (h.y + 0.5) * TILE + bob);
    }
  }

  // 10. Heavy Portcullis Gates
  for (const d of roomDoors) {
    if (!d.open) {
      const dx = d.x * TILE, dy = d.y * TILE;
      ctx.fillStyle = '#0F172A';
      ctx.fillRect(dx + 2, dy + 2, TILE - 4, TILE - 4);
      for (let i = 0; i < 4; i++) {
        const bx = dx + 6 + i * 10;
        ctx.fillStyle = '#B45309';
        ctx.fillRect(bx, dy + 3, 4, TILE - 6);
      }
      ctx.fillStyle = '#78350F';
      ctx.fillRect(dx + 2, dy + 10, TILE - 4, 5);
      ctx.fillRect(dx + 2, dy + TILE - 15, TILE - 4, 5);
    }
  }

  // 11. Exit Gateway
  if (room.exit) {
    const ex = room.exit.x * TILE, ey = room.exit.y * TILE;
    const allOpen = roomDoors.every(d => d.open);
    ctx.fillStyle = allOpen ? `rgba(16, 185, 129, ${0.4 + portalPulse * 0.3})` : 'rgba(71, 85, 105, 0.4)';
    ctx.fillRect(ex, ey, TILE, TILE);
    if (allOpen) {
      ctx.strokeStyle = '#34D399';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(ex + 4, ey + 4, TILE - 8, TILE - 8);
      ctx.fillStyle = '#34D399';
      ctx.beginPath();
      ctx.moveTo(ex + TILE * 0.7, ey + TILE/2);
      ctx.lineTo(ex + TILE * 0.35, ey + TILE * 0.28);
      ctx.lineTo(ex + TILE * 0.35, ey + TILE * 0.72);
      ctx.closePath();
      ctx.fill();
    }
  }

  // 12. PUSHABLE BLOCKS (Posh Carved 3D Ancient Monoliths!)
  for (const b of roomBlocks) {
    const bx = b.displayX;
    const by = b.displayY;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fillRect(bx + 6, by + 6, TILE - 6, TILE - 6);

    ctx.fillStyle = '#44403C';
    ctx.fillRect(bx + 3, by + 3, TILE - 6, TILE - 6);

    ctx.strokeStyle = '#78716C';
    ctx.lineWidth = 2.5;
    ctx.strokeRect(bx + 3, by + 3, TILE - 6, TILE - 6);

    ctx.strokeStyle = '#D97706';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx + TILE/2, by + 10);
    ctx.lineTo(bx + TILE - 10, by + TILE/2);
    ctx.lineTo(bx + TILE/2, by + TILE - 10);
    ctx.lineTo(bx + 10, by + TILE/2);
    ctx.closePath();
    ctx.stroke();

    ctx.fillStyle = '#F59E0B';
    ctx.fillRect(bx + TILE/2 - 3, by + TILE/2 - 3, 6, 6);
  }

  // 13. Draw Player
  drawPlayer();

  // 14. Particles
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

function drawPlayer() {
  const px = player.x - player.w / 2;
  const py = player.y - player.h / 2 - player.z;

  ctx.save();
  ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.beginPath();
  const shadowScale = Math.max(0.4, 1 - player.z / 180);
  ctx.ellipse(player.x, player.y + player.h/2 - 2, (player.w * 0.45) * shadowScale, 5 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  if (player.invulnTimer > 0 && Math.sin(Date.now() * 0.03) > 0) {
    return;
  }

  ctx.save();
  if (player.flipX) {
    ctx.translate(player.x, 0);
    ctx.scale(-1, 1);
    ctx.translate(-player.x, 0);
  }

  ctx.fillStyle = '#0891B2';
  ctx.fillRect(px + 4, py + 8, player.w - 8, player.h - 12);
  ctx.strokeStyle = '#06B6D4';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(px + 4, py + 8, player.w - 8, player.h - 12);

  ctx.fillStyle = '#78350F';
  ctx.fillRect(px + 6, py + 2, player.w - 12, 10);

  ctx.fillStyle = '#FDE68A';
  ctx.fillRect(px + 10, py + 8, player.w - 20, 8);

  ctx.fillStyle = '#0F172A';
  ctx.fillRect(px + player.w - 15, py + 10, 3, 3);

  ctx.fillStyle = '#F59E0B';
  ctx.fillRect(px + player.w/2 - 3, py + player.h - 10, 6, 4);

  ctx.restore();
}

function drawPortal(tx, ty, pulse, color) {
  const cx = (tx + 0.5) * TILE, cy = (ty + 0.5) * TILE;
  ctx.save();
  ctx.globalAlpha = 0.35 + pulse * 0.3;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, TILE * 0.45);
  grad.addColorStop(0, color);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, TILE * 0.45, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 0.85;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(cx, cy, TILE * 0.32 * pulse, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawCrystal(cx, cy) {
  ctx.save();
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, TILE * 0.45);
  grad.addColorStop(0, 'rgba(192, 132, 252, 0.45)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, TILE * 0.45, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#C084FC';
  ctx.beginPath();
  ctx.moveTo(cx, cy - 14);
  ctx.lineTo(cx + 9, cy);
  ctx.lineTo(cx, cy + 14);
  ctx.lineTo(cx - 9, cy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#F3E8FF';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
}

function drawHeart(cx, cy) {
  ctx.save();
  ctx.fillStyle = '#EC4899';
  ctx.shadowColor = '#BE185D';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(cx - 4, cy - 4, 5, 0, Math.PI * 2);
  ctx.arc(cx + 4, cy - 4, 5, 0, Math.PI * 2);
  ctx.lineTo(cx, cy + 8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawAtmosphere() {
  ctx.save();
  const lx = player.x;
  const ly = player.y - player.z;
  const lightRad = 290;
  const flicker = Math.sin(Date.now() * 0.008) * 6;

  const ambient = ctx.createRadialGradient(lx, ly, 30, lx, ly, lightRad + flicker);
  ambient.addColorStop(0, 'rgba(0, 0, 0, 0)');
  ambient.addColorStop(0.65, 'rgba(8, 12, 24, 0.18)');
  ambient.addColorStop(1, 'rgba(4, 7, 16, 0.65)');

  ctx.fillStyle = ambient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const m of ambientEmbers) {
    ctx.fillStyle = m.color;
    ctx.globalAlpha = m.alpha * 0.7;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// --- Main Engine Loop ---
let lastTime = 0;
let pauseDebounce = 0;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  pauseDebounce -= dt;

  if (keys['m'] && pauseDebounce <= 0) {
    muted = !muted;
    pauseDebounce = 0.3;
    showNotification(muted ? '🔇 Sound Muted' : '🔊 Sound Enabled');
  }

  for (let num = 1; num <= 7; num++) {
    if (keys[num.toString()] && pauseDebounce <= 0) {
      warpTo(num - 1);
      pauseDebounce = 0.3;
      break;
    }
  }

  switch (gameState) {
    case 'menu':
      drawMenu();
      if (keys['enter']) { startGame(); keys['enter'] = false; }
      break;

    case 'playing':
      if (roomTransDir !== 0) {
        updateTransition(dt);
        drawRoom();
        drawAtmosphere();
        drawHUD();
        ctx.fillStyle = `rgba(0, 0, 0, ${roomTransition})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        updatePlayer(dt);
        updateTraps(dt);
        updateDoors();
        updateCollectibles();
        updatePortals();
        updateExit();
        updateParticles(dt);
        if (notificationTimer > 0) {
          notificationTimer -= dt;
          if (notificationTimer <= 0) notification = null;
        }
        drawRoom();
        drawAtmosphere();
        drawHUD();
      }
      break;

    case 'victory':
      updateParticles(dt);
      drawVictory();
      if (keys['enter']) {
        keys['enter'] = false;
        gameState = 'menu';
      }
      break;
  }

  requestAnimationFrame(gameLoop);
}

function startGame() {
  rooms = createRooms();
  totalCrystals = rooms.reduce((sum, r) => sum + (r.crystals ? r.crystals.length : 0), 0);
  crystalCount = 0;
  collectedCrystals.clear();
  collectedHearts.clear();
  player.hp = player.maxHp;
  loadRoom(0);
  gameState = 'playing';
  showNotification('Chamber 1: The Forgotten Entrance...');
}

// Boot Engine Immediately
startGame();
requestAnimationFrame(gameLoop);
</script>
